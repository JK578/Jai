name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python scripts/build_phase5_wheels.py
      - run: 'python -m pip install --only-binary=:all: --find-links .cache/phase5-wheels -r apps/api/requirements-dev.lock.txt'
      - run: python -m pip install --no-deps -e apps/api
      - run: python -m scripts.check_publish_files
      - run: python -m ruff check --config apps/api/pyproject.toml apps/api
      - run: python -m ruff format --check --config apps/api/pyproject.toml apps/api
      - run: python -m ruff check --config apps/api/pyproject.toml scripts
      - run: python -m ruff format --check --config apps/api/pyproject.toml scripts
      - run: python -m pytest apps/api/tests -m "not database"
      - run: python -m pip check
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python scripts/build_phase5_wheels.py
        working-directory: .
      - run: 'python -m pip install --only-binary=:all: --find-links .cache/phase5-wheels -r apps/api/requirements-dev.lock.txt'
        working-directory: .
      - run: python -m pip install --no-deps -e apps/api
        working-directory: .
      - run: |
          $env:NODE_EXE = (Get-Command node).Source
          python scripts/smoke.py
        working-directory: .
